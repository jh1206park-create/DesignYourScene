<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Design Your Scene
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="login-page">


    <div class="login-box">


        <div class="login-brand">
            Design Your Scene
        </div>


        <div class="login-subtitle">
            부르는 순간, 나만의 공간
        </div>


        <form id="login-form">


            <div class="input-group">

                <label>
                    ID
                </label>

                <input
                    type="text"
                    id="email"
                    placeholder="ID"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    비밀번호
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="비밀번호"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                로그인
            </button>


            <div
                id="login-error"
                class="login-error"
            ></div>


        </form>


    </div>


</div>


<script>

const API_URL =
    "http://localhost:8000";


const form =
    document.getElementById(
        "login-form"
    );


const error =
    document.getElementById(
        "login-error"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        error.textContent =
            "";


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        try {

            const response =
                await fetch(
                    `${API_URL}/login`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                email: email,

                                password:
                                    password

                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "로그인에 실패했습니다."
                );

            }


            localStorage.setItem(
                "session_token",
                data.token
            );


            window.location.href =
                "index.html";

        }


        catch (err) {

            console.error(err);

            error.textContent =
                err.message;

        }

    }
);

</script>


</body>

</html>
