<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Your Scene</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>Design Your Scene</h1>
            <p>당신의 공간을 원하는 장면으로</p>
        </header>

        <section class="scenes">
            <h2>SCENE</h2>

            <div class="scene-group">
                <h3>🏠 집</h3>

                <div class="scene-row">
                    <button>☀️<span>기상</span></button>
                    <button>🚪<span>외출</span></button>
                    <button>🏠<span>귀가</span></button>
                    <button>🌙<span>취침</span></button>
                </div>
            </div>

            <div class="scene-group">
                <h3>🏢 사무실</h3>

                <div class="scene-row">
                    <button>🚪<span>출근</span></button>
                    <button>🌙<span>퇴근</span></button>
                </div>
            </div>

        </section>

        <section class="room">

            <h2>거실</h2>

            <div class="device">
                <span>💡 조명</span>
                <span class="status on">ON</span>
            </div>

            <div class="device">
                <span>❄️ 에어컨</span>
                <span class="status off">OFF</span>
            </div>

            <div class="device">
                <span>🪟 커튼</span>
                <span class="status off">CLOSED</span>
            </div>

        </section>

        <section class="room">

            <h2>침실</h2>

            <div class="device">
                <span>💡 조명</span>
                <span class="status off">OFF</span>
            </div>

            <div class="device">
                <span>❄️ 에어컨</span>
                <span class="status off">OFF</span>
            </div>

        </section>

    </div>

    <script src="app.js"></script>

</body>
</html>
