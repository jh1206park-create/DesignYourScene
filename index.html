<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Design Your Scene</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="app">


    <header>

        <h1>
            Design Your Scene
        </h1>

        <p>
            부르는 순간, 나만의 공간
        </p>

        <p
            id="customer-name"
            class="customer-name"
        >
            공간 정보를 불러오는 중...
        </p>

    </header>


    <!-- =================================================
         SCENE
    ================================================== -->

    <section class="scenes">

        <h2>
            SCENE
        </h2>

        <div id="scene-container"></div>

        <div id="api-result"></div>

    </section>


    <!-- =================================================
         DEVICE
    ================================================== -->

    <section class="devices">

        <h2>
            DEVICE
        </h2>

        <div id="device-container"></div>

    </section>


</div>


<script src="app.js"></script>


</body>

</html>
